<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Statue of Liberty holding the scales of justice">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12294D"/><stop offset="1" stop-color="#0C1E3B"/></linearGradient></defs>
  <circle cx="50" cy="50" r="49" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="45.5" fill="none" stroke="#7C2A3B" stroke-width="1.8"/>

  <!-- ===== Statue of Liberty (left) ===== -->
  <g fill="#F1EDE4">
    <path d="M25.7 23.8 L20.8 20.2 L26.3 22.8 Z"/><path d="M26.3 22.7 L22.9 17.7 L27.2 22.0 Z"/><path d="M27.3 22.0 L25.8 16.1 L28.4 21.6 Z"/><path d="M28.4 21.6 L29.0 15.5 L29.6 21.6 Z"/><path d="M29.6 21.6 L32.2 16.1 L30.7 22.0 Z"/><path d="M30.8 22.0 L35.1 17.7 L31.7 22.7 Z"/><path d="M31.7 22.8 L37.2 20.2 L32.3 23.8 Z"/>
    <circle cx="29" cy="25" r="3.5"/>
    <!-- draped robe: shoulders, waist indent, flared hem (not a triangle) -->
    <path d="M25.5 29
             C22.8 29.4 21.8 31.8 21.6 34.5
             C21.3 39 22.2 43 21 48
             C19.6 54 18.6 62 19.2 71
             L20.2 78
             L38.2 78
             L37.6 71
             C37 62 36.6 54 35.6 48
             C34.8 43 35.4 39 35.2 34.5
             C35 31.8 34 29.4 31.3 29 Z"/>
    <!-- pedestal base -->
    <rect x="17.5" y="78" width="23" height="4.2" rx="0.6"/>
    <rect x="19.5" y="82.2" width="19" height="3.2" rx="0.6"/>
    <!-- left arm holding the tablet of law, against the chest -->
    <path d="M22 37 C19.5 40 18.6 44 19.2 49 L23 48 C22.6 44 23 41 25 38.5 Z"/>
    <rect x="15.6" y="44.5" width="9.5" height="12.5" rx="1" transform="rotate(-16 20 51)"/>
    <!-- raised right arm, reaching up-and-out to hold the balance aloft -->
    <path d="M34 33 C42 29 50 24.5 57 20.5 L59.4 23.8 C52.5 28 44.5 33 37 38.5 Z"/>
  </g>
  <!-- subtle robe folds -->
  <g fill="none" stroke="#B9B2A2" stroke-width="0.7" opacity="0.5">
    <path d="M28.8 34 L28.8 77"/><path d="M24 44 L22 76"/><path d="M33.5 44 L35 76"/>
  </g>

  <!-- ===== balance HANGING from the hand with a clear drop, in open space right ===== -->
  <g stroke="#F1EDE4" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 21.5 L62 31"/>              <!-- suspension cord: clear gap from hand to beam -->
    <path d="M50 33 L76 33"/>                <!-- level beam -->
    <path d="M50 33 L46 40 M50 33 L54 40 M45 40 Q50 44.6 55 40"/>
    <path d="M76 33 L72 40 M76 33 L80 40 M71 40 Q76 44.6 81 40"/>
    <circle cx="62" cy="31" r="1.5" fill="#F1EDE4" stroke="none"/>
  </g>
</svg>